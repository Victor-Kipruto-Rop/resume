<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura — Modern Minimalist Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root[data-theme="dark"] {
      --bg-primary: #0a0c10;
      --bg-surface: #12161f;
      --bg-surface-hover: #1a202c;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: rgba(99, 102, 241, 0.15);
      --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      --badge-bg: rgba(255, 255, 255, 0.06);
    }

    :root[data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-hover: #f1f5f9;
      --border-color: rgba(0, 0, 0, 0.08);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-light: rgba(79, 70, 229, 0.1);
      --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      --badge-bg: rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Layout Structure */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-primary);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 80px;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .brand span {
      color: var(--accent);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .theme-toggle {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .theme-toggle:hover {
      background-color: var(--bg-surface-hover);
    }

    /* Hero Section */
    .hero-section {
      padding: 60px 0 40px;
    }

    .featured-card {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 32px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      cursor: pointer;
    }

    .featured-card:hover .featured-img {
      transform: scale(1.03);
    }

    .featured-img-wrap {
      overflow: hidden;
      height: 100%;
      min-height: 380px;
      position: relative;
    }

    .featured-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .featured-content {
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .badge {
      display: inline-block;
      align-self: flex-start;
      padding: 6px 14px;
      background: var(--badge-bg);
      border: 1px solid var(--border-color);
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .featured-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.25rem;
      line-height: 1.25;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .meta-text {
      font-size: 0.875rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: auto;
      padding-top: 24px;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin: 40px 0 32px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .cat-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 100px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .search-box {
      position: relative;
      min-width: 260px;
    }

    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 16px 10px 40px;
      border-radius: 100px;
      font-size: 0.875rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Articles Grid */
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 32px;
      padding-bottom: 80px;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--card-shadow);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--accent-light);
    }

    .card-img-wrap {
      height: 200px;
      overflow: hidden;
      position: relative;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .card-img {
      transform: scale(1.05);
    }

    .card-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      line-height: 1.3;
      margin: 12px 0;
      color: var(--text-main);
    }

    .card-excerpt {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .bookmark-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
    }

    .bookmark-btn.active {
      color: var(--accent);
    }

    /* Responsive Utilities */
    @media (max-width: 868px) {
      .featured-card {
        grid-template-columns: 1fr;
      }
      .featured-img-wrap {
        min-height: 240px;
      }
      .featured-content {
        padding: 28px;
      }
      .featured-title {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="container nav-inner">
      <a href="#" class="brand">Aura<span>.</span></a>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">🌙</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Featured Hero Section -->
    <section class="hero-section">
      <article class="featured-card">
        <div class="featured-img-wrap">
          <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80" alt="Hero Artwork" class="featured-img">
        </div>
        <div class="featured-content">
          <span class="badge">Architecture & Design</span>
          <h1 class="featured-title">The Renaissance of Minimalist Digital Spaces</h1>
          <p class="card-excerpt">Discovering how digital interfaces are shifting away from decorative clutter to prioritize essential typography, functional white space, and intentional human interaction.</p>
          <div class="meta-text">
            <span>By Elena Rostova</span> • 
            <span>Oct 24, 2026</span> • 
            <span>6 min read</span>
          </div>
        </div>
      </article>
    </section>

    <!-- Interactive Filtering Bar -->
    <div class="controls-bar">
      <div class="categories" id="categoryContainer">
        <button class="cat-btn active" data-category="All">All Posts</button>
        <button class="cat-btn" data-category="Tech">Tech</button>
        <button class="cat-btn" data-category="Design">Design</button>
        <button class="cat-btn" data-category="Culture">Culture</button>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search articles...">
      </div>
    </div>

    <!-- Article Cards Grid -->
    <section class="articles-grid" id="articlesGrid"></section>
  </main>

  <script>
    // Blog Data Set
    const articles = [
      {
        id: 1,
        title: "Building Fluid Web Layouts with CSS Subgrid",
        excerpt: "Subgrid makes multi-nested layout structures effortless. Here is a deep dive into practical component patterns.",
        category: "Tech",
        author: "Devon Lane",
        date: "Oct 20, 2026",
        readTime: "4 min read",
        image: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: 2,
        title: "The Psychology of Color in Modern Software",
        excerpt: "How subtle palette shifts drive user focus, influence decision-making, and decrease fatigue during high-focus tasks.",
        category: "Design",
        author: "Sarah Jenkins",
        date: "Oct 18, 2026",
        readTime: "5 min read",
        image: "https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: 3,
        title: "Slow Tech: Embracing Digital Minimalism",
        excerpt: "Exploring the movement toward intentional app consumption, asynchronous work, and reduced notification cycles.",
        category: "Culture",
        author: "Marcus Vance",
        date: "Oct 15, 2026",
        readTime: "7 min read",
        image: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: 4,
        title: "Type Systems That Scale Gracefully",
        excerpt: "Setting up flexible, fluid typography structures using CSS clamming for consistent across-device hierarchy.",
        category: "Design",
        author: "Elena Rostova",
        date: "Oct 11, 2026",
        readTime: "3 min read",
        image: "https://images.unsplash.com/photo-1512486130939-2c4f79935e4f?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: 5,
        title: "The Next Era of Server-Driven UI",
        excerpt: "Decoupling design components from clients to stream interactive elements smoothly across edge networks.",
        category: "Tech",
        author: "Devon Lane",
        date: "Oct 08, 2026",
        readTime: "8 min read",
        image: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=800&q=80"
      }
    ];

    // State Management
    let currentCategory = 'All';
    let searchQuery = '';
    const bookmarkedIds = new Set();

    // DOM Elements
    const articlesGrid = document.getElementById('articlesGrid');
    const categoryContainer = document.getElementById('categoryContainer');
    const searchInput = document.getElementById('searchInput');
    const themeToggle = document.getElementById('themeToggle');

    // Theme Switch Logic
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      themeToggle.textContent = newTheme === 'dark' ? '🌙' : '☀️';
    });

    // Render Function
    function renderArticles() {
      const filtered = articles.filter(art => {
        const matchesCat = currentCategory === 'All' || art.category === currentCategory;
        const matchesSearch = art.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              art.excerpt.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        articlesGrid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--text-muted);">
            <h3>No articles found</h3>
            <p>Try searching for a different keyword or category.</p>
          </div>
        `;
        return;
      }

      articlesGrid.innerHTML = filtered.map(art => `
        <article class="card">
          <div class="card-img-wrap">
            <img src="${art.image}" alt="${art.title}" class="card-img">
          </div>
          <div class="card-body">
            <span class="badge">${art.category}</span>
            <h2 class="card-title">${art.title}</h2>
            <p class="card-excerpt">${art.excerpt}</p>
            <div class="card-footer">
              <div class="meta-text" style="padding-top: 0;">
                <span>${art.date}</span> • <span>${art.readTime}</span>
              </div>
              <button 
                class="bookmark-btn ${bookmarkedIds.has(art.id) ? 'active' : ''}" 
                onclick="toggleBookmark(${art.id})"
                aria-label="Bookmark post"
              >
                ${bookmarkedIds.has(art.id) ? '🔖' : '🏷️'}
              </button>
            </div>
          </div>
        </article>
      `).join('');
    }

    // Interactive Bookmark Toggle
    window.toggleBookmark = function(id) {
      if (bookmarkedIds.has(id)) {
        bookmarkedIds.delete(id);
      } else {
        bookmarkedIds.add(id);
      }
      renderArticles();
    };

    // Category Filtering
    categoryContainer.addEventListener('click', (e) => {
      if (e.target.classList.contains('cat-btn')) {
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.dataset.category;
        renderArticles();
      }
    });

    // Search Input Event
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderArticles();
    });

    // Initial Execution
    renderArticles();
  </script>
</body>
</html>
